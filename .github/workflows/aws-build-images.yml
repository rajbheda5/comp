name: AWS build images

# Reusable: builds the four linux/amd64 images (app, portal, api, migrator) on
# free GitHub-hosted runners and pushes them to GHCR (container storage and
# bandwidth on GHCR are currently free). Next.js bakes NEXT_PUBLIC_* values in
# at build time, so the domains are inputs.

on:
  workflow_call:
    inputs:
      app_domain:
        type: string
        required: true
      portal_domain:
        type: string
        required: true
      api_domain:
        type: string
        required: true
      tag:
        description: Image tag to push (e.g. the commit SHA)
        type: string
        required: true
      also_tag_latest:
        type: boolean
        default: false
      posthog_key:
        type: string
        default: ''
      posthog_host:
        type: string
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: app
            file: Dockerfile
            target: app
          - name: portal
            file: Dockerfile
            target: portal
          - name: api
            file: apps/api/Dockerfile.multistage
            target: production
          - name: migrator
            file: deploy/aws/Dockerfile.migrator
            target: ''
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Image name, tags and build args
        id: meta
        env:
          NAME: ${{ matrix.name }}
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ inputs.tag }}
          LATEST: ${{ inputs.also_tag_latest }}
          APP_DOMAIN: ${{ inputs.app_domain }}
          PORTAL_DOMAIN: ${{ inputs.portal_domain }}
          API_DOMAIN: ${{ inputs.api_domain }}
          POSTHOG_KEY: ${{ inputs.posthog_key }}
          POSTHOG_HOST: ${{ inputs.posthog_host }}
        run: |
          for v in APP_DOMAIN PORTAL_DOMAIN API_DOMAIN; do
            if [ -z "${!v}" ]; then echo "::error::$v is empty (set the repository variable)"; exit 1; fi
          done
          image="ghcr.io/${OWNER,,}/comp-${NAME}"
          {
            echo 'tags<<EOF'
            echo "$image:$TAG"
            if [ "$LATEST" = true ]; then echo "$image:latest"; fi
            echo 'EOF'
          } >>"$GITHUB_OUTPUT"
          APP_URL="https://$APP_DOMAIN"; PORTAL_URL="https://$PORTAL_DOMAIN"; API_URL="https://$API_DOMAIN"
          {
            echo 'build_args<<EOF'
            case "$NAME" in
              app)
                echo "NEXT_PUBLIC_BETTER_AUTH_URL=$APP_URL"
                echo "NEXT_PUBLIC_APP_URL=$APP_URL"
                echo "NEXT_PUBLIC_PORTAL_URL=$PORTAL_URL"
                echo "NEXT_PUBLIC_API_URL=$API_URL"
                echo "NEXT_PUBLIC_SELF_HOSTED=true"
                echo "NEXT_PUBLIC_APP_ENV=production"
                echo "NEXT_PUBLIC_POSTHOG_KEY=$POSTHOG_KEY"
                echo "NEXT_PUBLIC_POSTHOG_HOST=$POSTHOG_HOST"
                ;;
              portal)
                echo "NEXT_PUBLIC_BETTER_AUTH_URL=$PORTAL_URL"
                echo "NEXT_PUBLIC_API_URL=$API_URL"
                echo "NEXT_PUBLIC_POSTHOG_KEY=$POSTHOG_KEY"
                echo "NEXT_PUBLIC_POSTHOG_HOST=$POSTHOG_HOST"
                ;;
            esac
            echo 'EOF'
          } >>"$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          build-args: ${{ steps.meta.outputs.build_args }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=min
