# Postgres client authentication.
#
# There are deliberately no plain "host" lines: every TCP connection — from the
# app containers or from Trigger.dev Cloud task runners over the internet —
# must use TLS and a SCRAM password. The Unix socket is only reachable from
# inside the postgres container (used by backups and `psql` maintenance).
#
# TYPE   DATABASE  USER  ADDRESS     METHOD
local    all       all               trust
hostssl  all       all   0.0.0.0/0   scram-sha-256
hostssl  all       all   ::/0        scram-sha-256
